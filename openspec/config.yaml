schema: spec-driven

context: |
  Domain: SearchExpressionParser — a Swift library that parses user search
  queries into a boolean expression tree (AND / OR / NOT, quoted phrases,
  parenthesized grouping) and supports negation-normal-form rewriting and
  phrase extraction.

  Tech stack: Swift 6.2, macOS 13+, Swift Package Manager, XCTest.
  No external dependencies; pure standard library.

  Workflow: TDD (red/green). Commits are small and logical.
  Changes flow through OpenSpec: proposal → (design if non-trivial) →
  specs → tasks → implementation.

rules:
  proposal:
    - "State the motivation in a Why section; list user-visible changes in What Changes; call out breaking changes and API impact in Impact."
    - "Keep proposals concise (≈300–500 words). Defer implementation detail to design.md."
  design:
    - "Include only when the change has non-obvious trade-offs, touches multiple specs, or affects public API shape."
    - "Use sections — Context, Goals / Non-Goals, Decisions, Risks & Trade-offs. Mention the test strategy."
  specs:
    - "One requirement per subsection. Each requirement must have at least one Scenario in Given / When / Then form."
    - "Reference existing specs under openspec/specs/ before introducing new capability names; prefer extending an existing spec over creating a parallel one."
  tasks:
    - "Numbered checklist. Sub-tasks nested under their parent. Order tasks so each one corresponds to a small, logical commit."
    - "Tasks must include writing failing tests before implementation (red / green TDD). Mark N/A tasks with strikethrough and a reason."
